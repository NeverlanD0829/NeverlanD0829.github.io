<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (() => { let theme; try { theme = localStorage.getItem('neverland-theme'); } catch {} document.documentElement.dataset.theme = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; document.documentElement.classList.add('js'); })();
  </script>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  {{ partial "header.html" . }}
  <main id="main" class="container" tabindex="-1">{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
  {{ partial "search.html" . }}
  {{ $js := resources.Get "js/main.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>
